<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Central Hub — IT Department</title>
<style>
  :root {
    --navy: #0a1a2f;
    --navy-light: #12233d;
    --navy-lighter: #1a2f4d;
    --gold: #c9a227;
    --gold-light: #e0c158;
    --cream: #f4efe2;
    --text-muted: #9aa8bd;
    --up-green: #3ecf6e;
    --down-red: #e0524f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--navy);
    color: var(--cream);
    min-height: 100vh;
    padding: 32px 16px;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 16px;
  }
  header h1 {
    color: var(--gold-light);
    letter-spacing: 2px;
    margin: 0 0 4px;
    font-size: 28px;
  }
  header p {
    color: var(--text-muted);
    margin: 0;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: var(--navy-light);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .card h2 {
    color: var(--gold-light);
    font-size: 18px;
    margin: 0 0 16px;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--navy-lighter);
    padding-bottom: 8px;
  }
  .system-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--navy-lighter);
  }
  .system-row:last-child { border-bottom: none; }
  .system-name { font-size: 15px; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .status-pill.up { background: rgba(62, 207, 110, 0.15); color: var(--up-green); }
  .status-pill.down { background: rgba(224, 82, 79, 0.15); color: var(--down-red); }
  .status-pill.checking { background: rgba(154, 168, 189, 0.15); color: var(--text-muted); }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
  }
  .response-time {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: 10px;
  }
  .refresh-btn {
    background: var(--navy-lighter);
    color: var(--gold-light);
    border: 1px solid var(--gold);
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .refresh-btn:hover { background: var(--gold); color: var(--navy); }
  .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--navy);
    border: 1px solid var(--navy-lighter);
    color: var(--cream);
    padding: 10px 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--gold);
  }
  .lookup-btn {
    background: var(--gold);
    color: var(--navy);
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .lookup-btn:hover { background: var(--gold-light); }
  .lookup-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .profile-grid {
    display: grid;
    grid-template-columns: 160px 1fr;
    row-gap: 10px;
    column-gap: 12px;
    margin-top: 16px;
  }
  .profile-grid .label {
    color: var(--text-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .profile-grid .value {
    color: var(--cream);
    font-size: 15px;
  }
  .empty-state, .error-state {
    color: var(--text-muted);
    font-size: 14px;
    padding: 12px 0;
  }
  .error-state { color: var(--down-red); }
  .readonly-badge {
    display: inline-block;
    background: var(--navy-lighter);
    color: var(--gold-light);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-left: 10px;
  }
  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 30px;
    letter-spacing: 0.5px;
  }
  .grades-heading {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--navy-lighter);
    color: var(--gold-light);
    font-size: 14px;
    letter-spacing: 0.5px;
  }
  .grades-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 13px;
  }
  .grades-table th {
    text-align: left;
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 6px 8px;
    border-bottom: 1px solid var(--navy-lighter);
  }
  .grades-table td {
    padding: 8px;
    color: var(--cream);
    border-bottom: 1px solid var(--navy-lighter);
  }
  .grades-empty {
    color: var(--text-muted);
    font-size: 13px;
    padding: 10px 0;
  }
  .match-list {
    margin-top: 14px;
  }
  .match-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--navy-lighter);
    border-radius: 4px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .match-row:hover {
    border-color: var(--gold);
    background: var(--navy-lighter);
  }
  .match-name {
    font-size: 14px;
    color: var(--cream);
  }
  .match-id {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'Courier New', monospace;
  }
  .match-meta {
    font-size: 12px;
    color: var(--text-muted);
    text-align: right;
  }
  .back-link {
    display: inline-block;
    margin-top: 16px;
    color: var(--gold-light);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<header>
  <h1>Central Hub</h1>
  <p>IT Department &middot; Group 3 &middot; Read-Only Monitor</p>
</header>

<div class="container">

  <div class="card">
    <h2>System Status <span class="readonly-badge">Live</span></h2>
    <div id="statusList">
      <div class="empty-state">Checking systems...</div>
    </div>
    <div style="margin-top: 16px; text-align: right;">
      <button class="refresh-btn" id="refreshBtn" onclick="checkStatus()">Refresh Status</button>
    </div>
  </div>

  <div class="card">
    <h2>Student Lookup <span class="readonly-badge">View Only</span></h2>
    <div class="search-row">
      <input type="text" id="studentIdInput" placeholder="Enter Student ID or Name (full or partial)">
      <button class="lookup-btn" id="lookupBtn" onclick="searchStudents()">Search</button>
    </div>
    <div id="profileResult">
      <div class="empty-state">Enter a student ID or name above to view their record via Student Records.</div>
    </div>
  </div>

</div>

<footer>Central Hub — Group 3 &middot; Data view only, no editing permitted here</footer>

<script>
  // Point this at your deployed Hub URL once it's live on Render.
  // For local testing, keep it as localhost.
  const HUB_BASE_URL = 'https://it-department-hub.onrender.com';

  const statusList = document.getElementById('statusList');
  const refreshBtn = document.getElementById('refreshBtn');
  const studentIdInput = document.getElementById('studentIdInput');
  const lookupBtn = document.getElementById('lookupBtn');
  const profileResult = document.getElementById('profileResult');

  async function checkStatus() {
    refreshBtn.disabled = true;
    statusList.innerHTML = '<div class="empty-state">Checking systems...</div>';
    try {
      const res = await fetch(`${HUB_BASE_URL}/hub/status`);
      const data = await res.json();
      const entries = Object.entries(data);
      if (entries.length === 0) {
        statusList.innerHTML = '<div class="empty-state">No systems registered yet.</div>';
      } else {
        statusList.innerHTML = entries.map(([key, sys]) => `
          <div class="system-row">
            <span class="system-name">${sys.name || key}</span>
            <span>
              <span class="status-pill ${sys.status}">
                <span class="dot"></span>${sys.status}
              </span>
              ${sys.responseTimeMs !== undefined ? `<span class="response-time">${sys.responseTimeMs} ms</span>` : ''}
            </span>
          </div>
        `).join('');
      }
    } catch (err) {
      statusList.innerHTML = `<div class="error-state">Could not reach the Hub: ${err.message}</div>`;
    } finally {
      refreshBtn.disabled = false;
    }
  }

  // Step 1: search by ID or name — may return multiple matches
  async function searchStudents() {
    const q = studentIdInput.value.trim();
    if (!q) return;
    lookupBtn.disabled = true;
    profileResult.innerHTML = '<div class="empty-state">Searching...</div>';
    try {
      const res = await fetch(`${HUB_BASE_URL}/hub/students/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if (!res.ok) {
        profileResult.innerHTML = `<div class="error-state">${data.error || 'Search failed.'}</div>`;
        return;
      }
      if (!Array.isArray(data) || data.length === 0) {
        profileResult.innerHTML = '<div class="empty-state">No students match that search.</div>';
        return;
      }
      if (data.length === 1) {
        // Only one match — go straight to the full profile
        showStudentProfile(data[0].student_id);
        return;
      }
      renderMatchList(data);
    } catch (err) {
      profileResult.innerHTML = `<div class="error-state">Failed to reach the Hub: ${err.message}</div>`;
    } finally {
      lookupBtn.disabled = false;
    }
  }

  function renderMatchList(matches) {
    profileResult.innerHTML = `
      <div class="empty-state">${matches.length} students match — select the right one:</div>
      <div class="match-list">
        ${matches.map(s => `
          <div class="match-row" data-id="${s.student_id}">
            <div>
              <div class="match-name">${s.full_name}</div>
              <div class="match-id">${s.student_id}</div>
            </div>
            <div class="match-meta">
              Year ${s.year_level ?? '—'} &middot; Sec ${s.section ?? '—'}<br>
              ${s.enrollment_status ?? '—'}
            </div>
          </div>
        `).join('')}
      </div>
    `;
    profileResult.querySelectorAll('[data-id]').forEach(row => {
      row.addEventListener('click', () => showStudentProfile(row.dataset.id));
    });
  }

  // Step 2: show the full profile + grades for one specific student
  async function showStudentProfile(id) {
    profileResult.innerHTML = '<div class="empty-state">Loading student...</div>';
    try {
      const res = await fetch(`${HUB_BASE_URL}/hub/students/${encodeURIComponent(id)}`);
      const data = await res.json();
      if (!res.ok) {
        profileResult.innerHTML = `<div class="error-state">${data.error || 'Student not found.'}</div>`;
        return;
      }
      const fields = [
        ['Student ID', data.student_id],
        ['Full Name', data.full_name],
        ['Contact Number', data.contact_number],
        ['Email', data.email],
        ['Address', data.address],
        ['Year Level', data.year_level],
        ['Section', data.section],
        ['Enrollment Status', data.enrollment_status]
      ];
      profileResult.innerHTML = `
        <div class="profile-grid">
          ${fields.map(([label, value]) => `
            <div class="label">${label}</div>
            <div class="value">${value ?? '—'}</div>
          `).join('')}
        </div>
        <div class="grades-heading">Grades</div>
        <div id="gradesArea"><div class="grades-empty">Loading grades...</div></div>
        <div class="back-link" id="backToResults">&larr; New search</div>
      `;

      document.getElementById('backToResults').addEventListener('click', () => {
        studentIdInput.value = '';
        profileResult.innerHTML = '<div class="empty-state">Enter a student ID or name above to view their record via Student Records.</div>';
        studentIdInput.focus();
      });

      const gradesArea = document.getElementById('gradesArea');
      try {
        const gRes = await fetch(`${HUB_BASE_URL}/hub/students/${encodeURIComponent(id)}/grades`);
        const grades = await gRes.json();
        if (!gRes.ok) {
          gradesArea.innerHTML = `<div class="grades-empty">${grades.error || 'Could not load grades.'}</div>`;
        } else if (!Array.isArray(grades) || grades.length === 0) {
          gradesArea.innerHTML = '<div class="grades-empty">No grades on file yet.</div>';
        } else {
          gradesArea.innerHTML = `
            <table class="grades-table">
              <thead>
                <tr><th>Subject</th><th>Name</th><th>S.Y.</th><th>Sem</th><th>Grade</th><th>Remarks</th></tr>
              </thead>
              <tbody>
                ${grades.map(g => `
                  <tr>
                    <td>${g.subject_code ?? '—'}</td>
                    <td>${g.subject_name ?? '—'}</td>
                    <td>${g.school_year ?? '—'}</td>
                    <td>${g.semester ?? '—'}</td>
                    <td>${g.grade ?? '—'}</td>
                    <td>${g.remarks ?? '—'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }
      } catch (gErr) {
        gradesArea.innerHTML = `<div class="grades-empty">Failed to reach the Hub for grades: ${gErr.message}</div>`;
      }
    } catch (err) {
      profileResult.innerHTML = `<div class="error-state">Failed to reach the Hub: ${err.message}</div>`;
    }
  }

  studentIdInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') searchStudents();
  });

  checkStatus();
</script>

</body>
</html>
