<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Hub — Group 3</title>
<style>
  :root {
    --navy: #0a1a2f;
    --navy-light: #12233d;
    --navy-lighter: #1a2f4d;
    --gold: #c9a227;
    --gold-light: #e0c158;
    --cream: #f4efe2;
    --text-muted: #9aa8bd;
    --up-green: #3ecf6e;
    --down-red: #e0524f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--navy);
    color: var(--cream);
    min-height: 100vh;
    padding: 32px 16px;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 16px;
  }
  header h1 {
    color: var(--gold-light);
    letter-spacing: 2px;
    margin: 0 0 4px;
    font-size: 28px;
  }
  header p {
    color: var(--text-muted);
    margin: 0;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: var(--navy-light);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .card h2 {
    color: var(--gold-light);
    font-size: 18px;
    margin: 0 0 16px;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--navy-lighter);
    padding-bottom: 8px;
  }
  .system-row {
    padding: 12px 0;
    border-bottom: 1px solid var(--navy-lighter);
  }
  .system-row:last-child { border-bottom: none; }
  .system-row-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .system-name { font-size: 15px; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .status-pill.up { background: rgba(62, 207, 110, 0.15); color: var(--up-green); }
  .status-pill.down { background: rgba(224, 82, 79, 0.15); color: var(--down-red); }
  .status-pill.checking { background: rgba(154, 168, 189, 0.15); color: var(--text-muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .response-time {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: 10px;
  }
  .status-error-detail {
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(224, 82, 79, 0.08);
    border-left: 3px solid var(--down-red);
    border-radius: 3px;
    font-size: 12px;
    color: var(--down-red);
    font-family: 'Courier New', monospace;
  }
  .refresh-btn {
    background: var(--navy-lighter);
    color: var(--gold-light);
    border: 1px solid var(--gold);
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .refresh-btn:hover { background: var(--gold); color: var(--navy); }
  .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty-state { color: var(--text-muted); font-size: 14px; padding: 12px 0; }
  .error-state { color: var(--down-red); font-size: 14px; padding: 12px 0; }
  .readonly-badge {
    display: inline-block;
    background: var(--navy-lighter);
    color: var(--gold-light);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-left: 10px;
  }
  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 30px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <h1>Admin Hub</h1>
  <p>Group 3 &middot; Read-Only Status Monitor</p>
</header>

<div class="container">

  <div class="card">
    <h2>System Status <span class="readonly-badge">Live</span></h2>
    <div id="statusList">
      <div class="empty-state">Checking systems...</div>
    </div>
    <div style="margin-top: 16px; text-align: right;">
      <button class="refresh-btn" id="refreshBtn" onclick="checkStatus()">Refresh Status</button>
    </div>
  </div>

</div>

<footer>Admin Hub — Group 3 &middot; Data view only, no editing permitted here</footer>

<script>
  const HUB_BASE_URL = 'https://it-department-hub.onrender.com';

  const statusList = document.getElementById('statusList');
  const refreshBtn = document.getElementById('refreshBtn');

  async function checkStatus() {
    refreshBtn.disabled = true;
    statusList.innerHTML = '<div class="empty-state">Checking systems...</div>';
    try {
      const res = await fetch(`${HUB_BASE_URL}/hub/status`);
      const data = await res.json();
      const entries = Object.entries(data);
      if (entries.length === 0) {
        statusList.innerHTML = '<div class="empty-state">No systems registered yet.</div>';
      } else {
        statusList.innerHTML = entries.map(([key, sys]) => `
          <div class="system-row">
            <div class="system-row-top">
              <span class="system-name">${sys.name || key}</span>
              <span>
                <span class="status-pill ${sys.status}">
                  <span class="dot"></span>${sys.status}
                </span>
                ${sys.responseTimeMs !== undefined
                  ? `<span class="response-time">${sys.responseTimeMs} ms</span>`
                  : ''}
              </span>
            </div>
            ${sys.status === 'down' && sys.error
              ? `<div class="status-error-detail">&#9888; ${sys.error}</div>`
              : ''}
          </div>
        `).join('');
      }
    } catch (err) {
      statusList.innerHTML = `<div class="error-state">Could not reach the Admin Hub: ${err.message}</div>`;
    } finally {
      refreshBtn.disabled = false;
    }
  }

  checkStatus();
  setInterval(checkStatus, 30000);
</script>

</body>
</html>
